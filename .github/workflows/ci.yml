name: Verify Ghost Trials
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHOST_MODE: local
      GHOST_PIPELINE_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install recording-validation tools
        # Runner apt mirrors occasionally stall; bound each attempt and retry.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout 150 sudo apt-get update && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:auth
      - run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
      - run: uv sync --locked --extra dev --extra models --extra storage
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - run: git diff --check
      - run: GHOST_BACKEND_ORIGIN=https://backend.example.com uv run --frozen python scripts/build_netlify.py
      - run: docker build -t ghost-trials:ci .
      - run: docker run --rm --user 10001:10001 --network none --read-only --tmpfs /data:uid=10001,gid=10001,mode=700 --tmpfs /tmp -v "$PWD/scripts/smoke_secure_api.py:/smoke.py:ro" ghost-trials:ci python /smoke.py
  ui:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install recording-validation tools
        # Runner apt mirrors occasionally stall; bound each attempt and retry.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout 150 sudo apt-get update && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:auth
      - run: npx playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
      - run: uv sync --locked --extra dev
      - run: npm run check:ui
