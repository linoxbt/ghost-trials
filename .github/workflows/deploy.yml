name: Deploy verified frontend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GHOST_MODE: local
      GHOST_PIPELINE_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install recording-validation tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
      - run: uv sync --frozen --extra dev --extra physics --extra models --extra storage
      - run: uv run --frozen pytest -q
  frontend:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GHOST_BACKEND_ORIGIN: ${{ vars.GHOST_BACKEND_ORIGIN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:auth
      - run: npm audit --omit=dev --audit-level=high
      - name: Build and check backend
        run: |
          python scripts/build_netlify.py
          health="$(curl --fail --retry 3 --silent --show-error "$GHOST_BACKEND_ORIGIN/health")"
          test "$(printf '%s' "$health" | jq -r '.api_contract')" = "multidomain-v1"
          for path in agent-trials demonstration-readiness; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$GHOST_BACKEND_ORIGIN/$path")"
            if [ "$status" != 200 ] && [ "$status" != 401 ]; then
              echo "Backend route /$path is unavailable (HTTP $status)" >&2
              exit 1
            fi
          done
      - name: Deploy
        run: npx --yes netlify-cli@23.6.0 deploy --prod --no-build --dir netlify-dist --site "$NETLIFY_SITE_ID"
