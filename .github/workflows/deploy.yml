name: Deploy verified frontend
on:
  workflow_dispatch:
# Production deploys are only accepted from main; protect the production environment to enforce this too.
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GHOST_MODE: local
      GHOST_PIPELINE_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install recording-validation tools
        # Runner apt mirrors occasionally stall; bound each attempt and retry.
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            timeout 150 sudo apt-get update && timeout 150 sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            sleep 10
          done
          exit 1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.21"
      - run: uv sync --locked --extra dev --extra models --extra storage
      - run: uv run --frozen pytest -q
  frontend:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GHOST_BACKEND_ORIGIN: ${{ vars.GHOST_BACKEND_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:auth
      - run: npm audit --omit=dev --audit-level=high
      - name: Build and check backend
        run: |
          python scripts/build_netlify.py
          health="$(curl --fail --retry 3 --silent --show-error "$GHOST_BACKEND_ORIGIN/health")"
          test "$(printf '%s' "$health" | jq -r '.api_contract')" = "multidomain-v1"
          for path in agent-trials demonstration-readiness; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$GHOST_BACKEND_ORIGIN/$path")"
            if [ "$status" != 200 ] && [ "$status" != 401 ]; then
              echo "Backend route /$path is unavailable (HTTP $status)" >&2
              exit 1
            fi
          done
      - name: Install the Netlify CLI
        # Installed before the token exists in any step, with lifecycle scripts disabled.
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/netlify" netlify-cli@23.6.0
      - name: Deploy
        # The token is visible to this step only, and only to the pinned CLI installed above.
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID must be set in the production environment" >&2
            exit 1
          fi
          "$RUNNER_TEMP/netlify/node_modules/.bin/netlify" deploy --prod --no-build --dir netlify-dist --site "$NETLIFY_SITE_ID"
