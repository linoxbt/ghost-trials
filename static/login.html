<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>Sign in · Ghost Trials</title>
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
  <a class="skip-link" href="#sign-in">Skip to sign in</a>
  <div class="auth-page">
    <header class="auth-header">
      <a class="auth-brand" href="/" aria-label="Ghost Trials home">
        <img src="/assets/ghost-mark.svg" alt="" width="36" height="41">
        <span>ghost trials<span class="brand-period">.</span></span>
      </a>
      <a class="auth-back" href="/">Back to the site <span aria-hidden="true">↗</span></a>
    </header>
    <main class="auth-main">
      <section class="auth-story" aria-labelledby="story-title">
        <div class="auth-kicker"><span class="auth-signal"></span> ROBOTS + AI AGENTS</div>
        <h1 id="story-title">Find the failure.<br><em>Keep the proof.</em></h1>
        <p>Evidence-backed testing for executable robots and agents.</p>
        <div class="auth-graphic" aria-hidden="true">
          <div class="graphic-path"><span class="path-axis"></span><span class="path-point pass">01</span><span class="path-point pass">02</span><span class="path-point near">03</span><span class="path-point fail">04</span></div>
        </div>
      </section>
      <section class="auth-panel" id="sign-in" aria-labelledby="sign-in-title">
        <h2 id="sign-in-title">Sign in<span>.</span></h2>
        <div id="privy-login"><p id="signin-loading" role="status">Loading secure sign-in…</p><noscript><p class="auth-error">Sign-in needs JavaScript. Enable it, or use private deployment access below if your team provided a token.</p></noscript></div>
        <a id="demo-link" class="auth-secondary" href="/app/" hidden>Preview the synthetic demo →</a>
        <details id="private-team" hidden>
          <summary>Private deployment access</summary>
          <form method="post" action="/auth/session">
            <label for="token">Deployment access token</label>
            <input id="token" name="token" type="password" required autocomplete="current-password">
            <input id="token-next" name="next" type="hidden">
            <button class="auth-secondary" type="submit">Open private deployment</button>
            <p id="token-error" class="auth-error" role="alert" hidden></p>
          </form>
        </details>
      </section>
    </main>
    <footer class="auth-footer"><span>GHOST TRIALS · PRIVATE WORKSPACE</span></footer>
  </div>
  <script src="/assets/login-fallback.js?v=token-next-v1" defer></script>
  <script type="module" src="/assets/auth/login.js"></script>
</body>
</html>
