[project]
name = "ghost-trials"
version = "0.1.0"
description = "Auditable simulation safety evaluation for physical AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
  "PyJWT[crypto]>=2.10,<3",
  "mujoco>=3.3,<4",
  "numpy>=2,<3",
]

[project.scripts]
ghost-trials-preflight = "ghost_trials.preflight:main"

[project.optional-dependencies]
worker = ["imageio[ffmpeg]>=2.37,<3"]
physics = [] # Compatibility alias; MuJoCo is now a required CPU runtime dependency.
models = ["huggingface-hub>=0.34,<2"]
storage = ["boto3>=1.40,<2"]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = ["netlify-dist", "node_modules"]

[tool.ruff.lint]
# Correctness-focused: undefined names, unused imports/variables, syntax errors.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# Pytest injects fixtures by parameter name, which pyflakes reads as redefinitions.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghost_trials", "workers"]
