services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # This compose file publishes only to host loopback. Internet-facing
      # deployments use the guarded entrypoint with public auth enabled.
      GHOST_PUBLIC_DEPLOYMENT: "false"
    env_file:
      - path: .env
        required: false
    volumes:
      - ghost-data:/data
volumes:
  ghost-data:
